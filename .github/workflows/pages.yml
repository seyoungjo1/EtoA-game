name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 저장소에서 Pages 를 켜두어야 합니다.
      # Settings > Pages > Build and deployment > Source: GitHub Actions
      # (Pages 를 처음 켜는 것은 저장소 소유자만 가능하며 워크플로 토큰으로는 안 됩니다)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # HTML 과 스크립트가 따로 캐시되어 버전이 엇갈리면 화면이 깨진다.
      # 커밋 해시를 붙여 새 배포에서는 항상 같은 버전끼리 짝이 맞게 한다.
      - name: Stamp asset versions
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(\"|')(assets/(css|js)/[A-Za-z0-9._-]+\.(css|js))\1#\1\2?v=$V\1#g" index.html
          grep -n 'assets/' index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
