name: Build Android APK

# 사이트를 그대로 띄우는 껍데기 앱이라 자주 빌드할 일은 없다.
# android/ 가 바뀌거나 손으로 돌릴 때만 만든다.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 서명 키.
      #  - 저장소 secrets 에 ANDROID_KEYSTORE_BASE64 (+ _PASSWORD, ALIAS, KEY_PASSWORD) 가 있으면 그 키로 서명한다.
      #    → 나중에 다시 빌드해도 기존 앱 위에 덮어 설치된다.
      #  - 없으면 이번 빌드용 임시 키를 만든다.
      #    → 설치는 되지만, 다음 빌드를 덮어 설치하려면 먼저 지워야 한다.
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "저장소 secrets 의 키로 서명합니다."
          else
            KS_PASS="etoa-temp-key"; KS_ALIAS="etoa"; KS_KEYPASS="etoa-temp-key"
            keytool -genkeypair -v -keystore "$KS" -storepass "$KS_PASS" -keypass "$KS_KEYPASS" \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=EtoA Gameboard, O=EtoA, C=KR" >/dev/null
            echo "임시 키로 서명합니다. (secrets 에 ANDROID_KEYSTORE_BASE64 를 넣으면 고정 키를 씁니다)"
          fi
          {
            echo "KEYSTORE_FILE=$KS"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KS_ALIAS"
            echo "KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/EtoA-gameboard.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EtoA-gameboard-apk
          path: out/EtoA-gameboard.apk

      # 항상 같은 주소로 받을 수 있게 릴리스로도 올린다.
      #   https://github.com/${{ github.repository }}/releases/latest/download/EtoA-gameboard.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: EtoA 게임판 앱 1.${{ github.run_number }}
          body: |
            사이트(https://seyoungjo1.github.io/EtoA-game/)를 그대로 띄우는 안드로이드 앱입니다.
            화면은 전부 사이트에서 오므로 앱은 다시 설치하지 않아도 됩니다.

            **설치**: 아래 `EtoA-gameboard.apk` 를 받아 열면 됩니다. "출처를 알 수 없는 앱" 허용이 필요할 수 있습니다.
          files: out/EtoA-gameboard.apk
          make_latest: true
